[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ps"
version = "0.1.10"
description = "Call any available system command from python"
readme = "README.md"
requires-python = ">=3.10"
keywords = []
authors = [{ name = "Thor Whalen" }]
dependencies = []

[project.license]
text = "Apache-2.0"

[project.urls]
Homepage = "https://github.com/thorwhalen/ps"

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-cov>=4.0", "ruff>=0.1.0"]
docs = ["sphinx>=6.0", "sphinx-rtd-theme>=1.0"]

[tool.ruff]
line-length = 88
target-version = "py310"
exclude = [
    "**/*.ipynb",
    ".git",
    ".venv",
    "build",
    "dist",
    "tests",
    "examples",
    "scrap",
]

[tool.ruff.lint]
select = ["D100"]
ignore = ["D203", "E501", "B905"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"**/tests/*" = ["D"]
"**/examples/*" = ["D"]
"**/scrap/*" = ["D"]

[tool.wads.ci.docs]
# Sphinx API-doc generation is unsafe for this package and must stay off.
# `ps` binds one `Command` object per executable found on PATH, and
# `Command.__doc__` is a property that shells out (`man 1 <cmd>`, then
# `<cmd> --help`) to build the doc on access. Autodoc reads `__doc__` on every
# module member, so a docs build executes every binary on the machine. On the
# CI runner that blocked forever on a GUI tool and the job was killed by the
# 6-hour timeout, which marked the whole run "cancelled".
enabled = false

[tool.pytest.ini_options]
minversion = "6.0"
# CI runs `pytest --doctest-modules` with no path argument, so collection is
# driven entirely by testpaths. This must list the package as well as tests/:
# the package's doctests are most of the test surface, and they are only reached
# because "ps" is named here. This previously pointed at tests/ alone, which did
# not exist, so pytest warned and fell back to rootdir-wide collection.
testpaths = ["ps", "tests"]
doctest_optionflags = ["NORMALIZE_WHITESPACE", "ELLIPSIS"]
